    heading="GLQ - 3425"
    heading-layout="aside"
    details='<b>Introduction à la mécanique des roches (French only)</b>
      <br />
      Analysis of stresses and strains, constitutive laws, failure criteria, physical properties of rocks, mechanical behavior of intact rocks and discontinuities, laboratory testing, geological characterization of rock masses, anisotropy of rocks and rock masses, geomechanical classifications, in situ stress measurements, field testing, analysis of strength and deformability of rock masses.'

    ></t-member>

    <t-member
    heading="GLQ - 8175"
    heading-layout="aside"
    details='<b>Mécanique des roches appliquée (French only)</b>
      <br />
      This course covers the methods and planning of a geotechnical investigation campaign, including drilling techniques, structural descriptions, and the use of Q and RMR classifications. It emphasizes the preparation of investigation reports, such as Geotechnical Baseline Reports (GBR) and geological cross-sections. Key topics include slope stability analysis using stereographic projections and limit equilibrium methods, numerical modeling in rock mechanics, groundwater flow in fractured media, and underground excavation techniques with a focus on instability assessment.'
    buttons='[
    {"href":"https://www.polymtl.ca/programmes/cours/introduction-la-mecanique-des-roches","img":"img/Logo-Poly.png", "alt":"Polytecnique Montreal"}
    ]'
    align="left"
    ></t-member>
